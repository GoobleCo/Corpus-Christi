<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#0e0e12">
    <title>Escape de la Ciudad</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0e0e12; overflow: hidden; }
        body { font-family: system-ui, sans-serif; color: #e2e2e8; }
        canvas.emscripten {
            display: block; position: fixed; inset: 0;
            width: 100vw !important; height: 100vh !important; height: 100dvh !important;
            border: 0; outline: none; touch-action: none;
        }
        #cargando {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px;
        }
        #cargando h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
        #cargando p { margin: 0; color: #8c8c98; }
        #girar { display: none; }
        @media (orientation: portrait) and (max-width: 700px) { #girar { display: block; } }
        a { color: #d64034; }
    </style>
</head>
<body>
    <div id="cargando">
        <h1>ESCAPE DE LA CIUDAD</h1>
        <p id="estado">Cargando...</p>
        <p id="girar">Para jugar mejor, girá el celular.</p>
        <p><a href="EscapeZombi-Windows.zip">Descargar para Windows</a></p>
    </div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
        var Module = {
            canvas: (function () { return document.getElementById('canvas'); })(),
            setStatus: function (t) {
                document.getElementById('estado').textContent = t || 'Listo';
                if (!t) document.getElementById('cargando').style.display = 'none';
            },
            print: function (t) { console.log(t); },
            printErr: function (t) { console.warn(t); }
        };
        document.getElementById('canvas').addEventListener('pointerdown', function () { this.focus(); });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
